<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>分子演出图鉴 · 细胞膜边检站</title><link rel="stylesheet" href="style.css"><style>
body{min-height:100dvh;background:#1c2d24}.theatre-header{display:flex;align-items:center;justify-content:space-between;padding:25px 35px;border-bottom:1px solid #71836866;gap:20px;background:#25372c}.theatre-header h1{font:600 26px "Songti SC",serif;letter-spacing:3px}.theatre-header p{font-size:10px;letter-spacing:1px;color:#aebc9e;margin-top:7px}.back-game{font-size:12px;color:#e0d4a6;border:1px solid #95a178;padding:10px 15px;text-decoration:none;white-space:nowrap}.theatre-shell{max-width:1450px;margin:auto;padding:27px 30px}.species-shelf{display:grid;grid-template-columns:repeat(8,1fr);gap:9px;margin-bottom:20px}.species-option{min-height:68px;background:#2c4031;border:1px solid #708063;color:#d1d7b8;text-align:left;padding:10px 12px}.species-option b{font-size:13px;font-weight:500;display:block}.species-option span{font-size:10px;color:#a0b18b;display:block;margin-top:5px}.species-option.active{background:#5a6846;border-color:#d2c48b;color:#f1e6bd}.theatre-shell .checkpoint{border:1px solid #79886c;border-radius:1px;height:424px;box-shadow:0 10px 35px #0003}.theatre-shell #scene{height:400px}.theatre-shell .scene-label{top:22px}.theatre-shell .stage-controls{top:20px}.theatre-shell .performance-caption{bottom:48px}.theatre-shell .performance-caption b{font-size:16px}.theatre-shell .performance-caption p{font-size:12px;margin-top:6px}.theatre-shell .window-sill{font-size:10px}.theatre-shell .scene-label.outside{left:24%}.theatre-shell .scene-label.inside{right:24%}.theatre-notes{display:flex;justify-content:space-between;gap:25px;margin-top:20px;border-top:1px solid #78896b66;padding-top:18px}.theatre-notes h2{font-size:14px;font-weight:500;letter-spacing:1px;color:#d2c795}.theatre-notes p{font-size:12px;color:#adba9e;line-height:1.9;margin-top:7px;max-width:850px}.theatre-notes .primary-button{align-self:flex-start;min-width:115px}.theatre-footer{color:#7f9579;font-size:10px;line-height:1.8;margin-top:25px}.theatre-shell #stagePause{min-height:34px}.theatre-shell .stage-controls button{font-size:11px;min-height:34px}.theatre-shell .live-tag{display:none}@media(max-width:900px){.species-shelf{grid-template-columns:repeat(4,1fr)}.theatre-shell{padding:20px}.theatre-shell .checkpoint{height:370px}.theatre-shell #scene{height:346px}.theatre-shell .stage-controls{top:62px}.theatre-shell .performance-caption p{font-size:11px}}@media(max-width:650px){.theatre-header{padding:18px 15px;gap:12px}.theatre-header h1{font-size:21px;letter-spacing:1px}.theatre-header p{font-size:8px}.back-game{font-size:10px;padding:9px}.theatre-shell{padding:16px 12px}.species-shelf{gap:6px;margin-bottom:15px}.species-option{padding:9px 8px;min-height:62px}.species-option b{font-size:11px}.species-option span{font-size:8px}.theatre-shell .checkpoint{height:342px}.theatre-shell #scene{height:318px}.theatre-shell .scene-label{top:16px;font-size:9px}.theatre-shell .scene-label.outside{left:16%}.theatre-shell .scene-label.inside{right:16%}.theatre-shell .stage-controls{top:40px;right:10px;left:10px;justify-content:flex-end}.theatre-shell .performance-caption{left:12px;right:12px;bottom:37px}.theatre-shell .performance-caption b{font-size:12px}.theatre-shell .performance-caption p{font-size:10px}.theatre-notes{display:block;margin-top:15px;padding-top:13px}.theatre-notes h2{font-size:13px}.theatre-notes p{font-size:11px}.theatre-notes .primary-button{margin-top:12px}.theatre-footer{font-size:9px;margin-top:18px}}
</style></head><body>
<header class="theatre-header"><div><h1>分子演出图鉴</h1><p>MEMBRANE CONTROL / 选择一种物质，观察它的专属演出</p></div><a class="back-game" href="index.html">返回边检站 →</a></header>
<main class="theatre-shell"><nav id="speciesShelf" class="species-shelf" aria-label="选择演出物质"></nav><section class="checkpoint" aria-label="分子演出舞台"><div class="scene-label outside">胞外区域 <small>EXTRACELLULAR</small></div><div class="scene-label inside">胞内区域 <small>CYTOPLASM</small></div><svg id="scene" preserveAspectRatio="xMidYMid meet" role="img" aria-label="分子运输机制演出"></svg><div class="stage-controls"><button id="stageReplay" aria-label="重播本次演出">↻ 重播</button><button id="stagePause">Ⅱ 暂停演出</button><button id="stageSkip">跳过演出 →</button></div><div class="performance-caption"><span id="scenePhase">演出</span><div><b id="sceneTitle"></b><p id="sceneNarration"></p></div></div><div class="window-sill"><span>第07号站 / 演示档案 · 不计分</span><span>结构、尺度、时间均为示意</span></div></section><section class="theatre-notes"><div><h2 id="mechanismTitle">简单扩散</h2><p id="mechanismDetail"></p></div><button id="playAgain" class="primary-button">再次播放 ↻</button></section><p class="theatre-footer">AI 辅助生成显微背景；分子、蛋白和运输动作由程序绘制。动态演出服从本作的具体案例条件，不能据此概括所有细胞或所有主动运输。胰岛素演示为“本站未授权胞吐时退回队列”。</p></main>
<script src="core.js"></script><script src="stage.js"></script><script>
(()=>{'use strict';const all=MembraneCore.DAYS.flatMap(d=>d.cases),S=MembraneStage,stage=new S.Stage(document.getElementById('scene'));
const entries=[['oxygen','氧气','O₂'],['carbon','二氧化碳','CO₂'],['ethanol','乙醇','C₂H₅OH'],['water','水','H₂O / AQP'],['glucose','葡萄糖','GLUT'],['sodium','钠离子','Na⁺ 通道'],['pump','钠钾泵','3 Na⁺ / 2 K⁺'],['insulin','胰岛素','分泌囊泡']];let selected='oxygen';
const shelf=document.getElementById('speciesShelf');shelf.innerHTML=entries.map(([id,name,sub])=>`<button class="species-option" data-species="${id}" aria-pressed="false"><b>${name}</b><span>${sub}</span></button>`).join('');
function play(id){selected=id;document.body.classList.remove('paused');document.getElementById('stagePause').textContent='Ⅱ 暂停演出';const c=all.find(c=>S.identify(c)===id&&(c.allowed||id==='insulin'));stage.reset(c);stage.scan(c);stage.sample(c);stage.verdict(c,c.allowed,{correct:true});document.querySelectorAll('[data-species]').forEach(b=>{b.classList.toggle('active',b.dataset.species===id);b.setAttribute('aria-pressed',String(b.dataset.species===id))});document.getElementById('mechanismTitle').textContent=id==='insulin'?'囊泡货运 · 本站拒绝申请':id==='pump'?'原发性主动运输 · 1 ATP／循环':c.route==='lipid'?'简单扩散 · 不直接消耗 ATP':c.route==='carrier'?'载体介导的协助扩散':'通道介导的协助扩散';document.getElementById('mechanismDetail').textContent=c.reason;}
shelf.onclick=e=>{const b=e.target.closest('[data-species]');if(b)play(b.dataset.species)};document.getElementById('stageReplay').onclick=()=>play(selected);document.getElementById('playAgain').onclick=()=>play(selected);document.getElementById('stageSkip').onclick=()=>stage.skip();document.getElementById('stagePause').onclick=()=>{const paused=document.body.classList.toggle('paused');document.getElementById('stagePause').textContent=paused?'▶ 继续演出':'Ⅱ 暂停演出'};play('oxygen');})();
</script></body></html>
